[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-data-factory"
version = "0.1.0"
dependencies = [
    "requests>=2.32,<3",
    "SQLAlchemy>=2.0.44,<3",
    "psycopg[binary]>=3.3,<4",
    "python-dotenv>=1.1.1,<2",
]
requires-python = ">=3.11"

[project.optional-dependencies]
ml = [
    "numpy>=2.3,<3",
    "pandas>=2.3,<4",
    "scipy>=1.16,<2",
    "scikit-learn>=1.8,<2",
    "matplotlib>=3.10,<4",
    "threadpoolctl>=3.5,<4",
]

[project.scripts]
data-factory = "data_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
